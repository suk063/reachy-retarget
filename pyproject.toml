[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-retarget"
version = "2.0.0"
description = "Retarget object-interaction demonstrations onto Reachy 2 as state-only training data"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.13", "h5py>=3.11", "pyyaml>=6", "pyarrow>=16"]

[project.optional-dependencies]
physics = ["mujoco>=3.2"]
archives = ["zstandard>=0.22"]
dev = ["pytest>=8"]
# tracking viewers (reachy_retarget.tracking.viewer, .mjviewer), pinned as in reachy-control
# (requirements.txt; mjviser as in its mjlab environment)
viz = ["viser==1.1.1", "trimesh==5.1.0", "pycollada==0.9.3", "mjviser==0.0.14"]

[project.scripts]
reachy-retarget = "reachy_retarget.cli:main"

[tool.setuptools.packages.find]
include = ["reachy_retarget*"]

[tool.setuptools.package-data]
"reachy_retarget.robot" = ["assets/**/*"]
"reachy_retarget.acquire" = ["catalog/*.yaml", "catalog/*.tsv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
