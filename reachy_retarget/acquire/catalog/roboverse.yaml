lineage:
  rlbench: Re-collected with RLBench's motion planner (github.com/Fisher-Wang/RLBench) in CoppeliaSim; 10 demos per task ('preview'
    release; close_box 100). Not the files of the original RLBench dataset; no other family of this project contains RLBench.
    Robot states need the calibration documented in reachy_retarget/sources/roboverse.py.
  calvin: calvin_traj_ann windows are 64-state crops (CALVIN language annotations) of CALVIN's continuous human play stream;
    windows of one stream may overlap (frame ranges in env_meta.source_dir). env_D_val is CALVIN's validation split (scene
    D). No other family of this project contains CALVIN.
not_catalogued:
  trajs/calvin/env_{A,B,C,D,D_val}_out/episode_chunk_*: the unannotated play stream cut into >= 300-step segments (7400+ files,
    ~1.9 GB). Annotated windows are crops of it; superset, not independent demonstrations of the windows.
  trajs/calvin/<task>_a/v2/*.pkl.gz: '29 per-task env-A files (199 windows each for open_drawer_a) with binary finger states,
    no frame indices, and franka_with_gripper_extension / ur5e_2f85 retargeted variants: a lower-fidelity overlapping version
    of calvin_traj_ann/env_A_out.'
  trajs/libero, trajs/libero90: LIBERO-Object (10 tasks) and a LIBERO-90 subset, migrated from LIBERO; overlap the native
    libero family.
  trajs/maniskill: ManiSkill2/3 tasks (actions + initial states only, no per-step states); overlap the native maniskill family.
  trajs/gapartmanip: 2 files x 10 demos (GAPartNet box / toilet, franka_with_gripper_extension, mesh assets); new but tiny,
    not adapted.
  trajs/simpler_env: 4 files of 100 x 20-step google_robot_static traces of one task (GraspSingleOpenedCokeCan); provenance
    unclear (policy traces), not adapted.
  trajs/metaworld, trajs/humanoidbench, trajs/bidex, trajs/debug: 'one Sawyer file, H1 locomotion, initial states only or
    debug: no manipulation demonstrations.'
