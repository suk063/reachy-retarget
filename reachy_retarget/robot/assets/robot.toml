Robot-local saved-input replay measured 21.11 ms median / 33.72 ms P99 without
profiling; all 1730 calls exceeded 10 ms. Moving the Python worker alone does not
meet the timing gate. The 10 ms command deadlines, source timestamp contract and
other motion guards remain enforced; no alternate controller is used.
Do not independently restart SDK or HAL: the critical-node watcher can shut down
core, systemd recreates it, and tripod-extend.service automatically commands
160 mm. This happened during the isolated SDK restart attempt, also removing
