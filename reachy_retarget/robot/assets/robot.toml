These are recorded limitations, not current live health. Detailed evidence and
run locations are in hardware/docs/controller.md.
"""
cameras_and_timing = """
Torso: Orbbec Gemini 336, registered RGB-D. Depth uses RGB optical coordinates,
not SDK left-IR extrinsics. Preserve raw depth, stride, endianness and per-frame
calibration; never resize mismatched RGB/depth into apparent registration.
RGB and depth are asynchronous. The camera looks about 46.3 degrees down and
sees table/seat surfaces only within roughly 1.2 m. Apply recorded depth correction once.
Head: two IMX296 fisheye lenses. SDK images are empty due to a DDS discovery issue;
WebRTC provides RGB at about 10 fps with occasional 1-3 second gaps. First track
is the left eye. Empirical pinhole/distortion/mount calibration is stream-specific;
DepthAI factory calibration must not be substituted. A 21-pose sweep gave about
3.3 px median reprojection; neck repeatability is about 0.2-0.3 degrees.
Receive timestamps do not prove synchronized exposure. Lower recording cam-hz
can improve freshness. Service restarts are explicit operational actions.
HeadToF uses SSH and temporarily owns the camera, stopping/restoring WebRTC.
It measures range along a ray, not optical Z. Absolute calibration is unavailable;
offset drifts, noise is 6-9 mm with roughly +/-20 mm patterns. It cannot set metric scale.
Direct ToF acquisition can stall RGB. D455 registration becomes invalid if either
camera moves. Head stereo is not an independently validated metric distance source.
"""
