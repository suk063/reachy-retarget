[cameras.head]
about = "Measured calibration of the head eyes of r2-0008 (teleop_head stereo pair, the WebRTC images, 960 x 720). Lens: pinhole with radial distortion, OpenCV convention (K, D = [k1, k2, p1, p2, k3]). Pose: camera_from_torso = Rot(mount_rotation_deg) @ the URDF's camera_from_torso at the neck joints read with the frame; mount_rotation_deg is a rotation vector in the eye's optical frame (x right, y down, z forward), in degrees. Use the lens and mount together."
date = "2026-09-25"
method = "Lens (K, D): torso RGB-D at one base pose, head images at 10 neck poses (pitch 10-28 deg, yaw -25..25 deg) in two sessions; SIFT matches between the torso RGB and each eye, RANSAC on the fundamental matrix; robust least squares over f, cx, cy, k1, k2 and the mount rotation of each eye. Fitting the images to the other eye leaves 3.6-9.9 px, which confirms the eye labels (first WebRTC video track = left eye). Mount rotation: refitted later the same day (run 20260925_194429_calib-check) with the lens kept: 21 neck poses (pitch 5-25 deg, yaw -30..30 deg, roll -15..15 deg), the median torso depth rendered into each eye and tracked into the real image (about 6800 tracks per eye). The previous mount rotations left a median of 6.6 / 6.3 px (left / right); these leave 3.6 / 3.2 px, and fits on half of the views reduce the other half from 5.9-6.9 to 3.1-4.1 px. Freeing the lens, neck offsets or a torso-camera rotation as well changed the median by only 0.1-0.4 px with unstable values, so they are not identifiable from these views. Repeated visits to one neck pose differ by 0.2-0.3 deg (about 2 px), the neck's repeatability. The principal point and the mount rotation are strongly correlated; use them together."
image_size = [960, 720]

